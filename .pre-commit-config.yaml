repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty check --force-exclude --exclude '.venv/**' --exclude 'viewer/**' --exclude '__pycache__/**'
        language: system
        types: [python]
        pass_filenames: true
        exclude: ^viewer/
  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast)
        entry: python -m pytest -k "not slow" -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: local
    hooks:
      - id: vitest
        name: vitest (viewer)
        entry: bash -c 'cd viewer && npx vitest run'
        language: system
        files: '^viewer/(src|tests)/.*\.tsx?$'
        pass_filenames: false
        stages: [pre-push]
  - repo: local
    hooks:
      - id: tsc
        name: tsc (viewer)
        entry: bash -c 'cd viewer && npx tsc --noEmit'
        language: system
        files: '^viewer/src/.*\.tsx?$'
        pass_filenames: false
  - repo: local
    hooks:
      - id: eslint
        name: eslint (viewer)
        entry: bash -c 'cd viewer && npx eslint src/'
        language: system
        files: '^viewer/src/.*\.tsx?$'
        pass_filenames: false
  - repo: local
    hooks:
      - id: prettier
        name: prettier (viewer)
        entry: bash -c 'cd viewer && npx prettier --check src/'
        language: system
        files: '^viewer/src/.*\.(tsx?|css)$'
        pass_filenames: false
